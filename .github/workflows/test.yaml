name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the mailsync submodule so postinstall doesn't try to
          # download a prebuilt mailsync binary from upstream S3 (our fork's
          # submodule commits don't exist there). The spec runner needs a real
          # mailsync binary (it runs `mailsync --mode migrate` at startup), so
          # we build it from the submodule below, cached per submodule commit.
          submodules: true

      - name: Get mailsync revision
        id: mailsync-rev
        run: echo "rev=$(git rev-parse HEAD:mailsync)" >> "$GITHUB_OUTPUT"

      - name: Cache mailsync build
        id: mailsync-cache
        uses: actions/cache@v4
        with:
          path: |
            app/mailsync
            app/mailsync.bin
            app/*.so*
          key: mailsync-${{ runner.os }}-ubuntu2204-${{ steps.mailsync-rev.outputs.rev }}

      - name: Install mailsync build dependencies
        if: steps.mailsync-cache.outputs.cache-hit != 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            autoconf automake build-essential cmake libtool pkg-config \
            libc-ares-dev libctemplate-dev libcurl4-openssl-dev libglib2.0-dev \
            libicu-dev liblzma-dev libsasl2-dev libsasl2-modules libssl-dev libtidy-dev \
            libxml2-dev uuid-dev

      - name: Build mailsync
        if: steps.mailsync-cache.outputs.cache-hit != 'true'
        run: ./mailsync/build.sh

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xvfb \
            dbus-x11 \
            libgbm1 \
            libnss3 \
            libasound2t64 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libgtk-3-0t64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint:check

      - name: Run Typecheck
        run: npm run typecheck

      # Ubuntu 23.10+ restricts unprivileged user namespaces through AppArmor, so
      # Electron cannot use its namespace sandbox and falls back to the SUID helper,
      # which is not setuid root inside node_modules. Re-allow the namespace sandbox
      # rather than passing --no-sandbox, so the tests run the way the app ships.
      - name: Allow Electron's namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        run: dbus-launch --exit-with-session xvfb-run -a npm test
        timeout-minutes: 20
